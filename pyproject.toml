[project]
name = "heatwave-ai-search"
version = "0.1.0"
description = "Semantic, keyword, and hybrid search with MySQL HeatWave and OCI Generative AI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "Flask>=3.1.3,<4",
    "mysql-connector-python>=26.10,<27",
    "oci>=2.189,<3",
    "python-dotenv>=1.2.4,<2",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
